<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1c22">
<meta name="description" content="Androidタブレット向けの手書きメモアプリ。スタイラスで書いて、フォルダで整理。">
<title>てがきメモ</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- ============ ライブラリ画面 ============ -->
<div id="library" class="screen">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="app-title">✍️ てがきメモ</div>
      <button class="icon-btn" id="btn-close-sidebar" title="閉じる" aria-label="サイドバーを閉じる">✕</button>
    </div>

    <div class="search-box">
      <input type="search" id="search-input" placeholder="メモを検索" aria-label="メモを検索">
    </div>

    <nav class="tree" id="folder-tree" aria-label="フォルダ一覧"></nav>

    <div class="sidebar-foot">
      <button class="ghost-btn" id="btn-new-folder">＋ 新しいフォルダ</button>
      <div class="foot-row">
        <button class="ghost-btn small" id="btn-export-all" title="全データをJSONで保存">⬇ バックアップ</button>
        <button class="ghost-btn small" id="btn-import-all" title="JSONから復元">⬆ 復元</button>
      </div>
      <button class="ghost-btn small" id="btn-theme">🌓 テーマ切替</button>
    </div>
  </aside>

  <main class="library-main">
    <header class="lib-header">
      <button class="icon-btn only-narrow" id="btn-open-sidebar" aria-label="フォルダを開く">☰</button>
      <h1 id="current-folder-name">すべてのメモ</h1>
      <div class="spacer"></div>
      <div class="seg" role="group" aria-label="並び順">
        <button class="seg-btn is-on" data-sort="updated">更新順</button>
        <button class="seg-btn" data-sort="created">作成順</button>
        <button class="seg-btn" data-sort="title">名前順</button>
      </div>
      <button class="primary-btn" id="btn-new-note">＋ 新規メモ</button>
    </header>

    <div class="note-grid" id="note-grid"></div>
    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-emoji">📝</div>
      <p>まだメモがありません</p>
      <button class="primary-btn" id="btn-new-note-empty">＋ 最初のメモを作る</button>
    </div>
  </main>
</div>

<!-- ============ エディタ画面 ============ -->
<div id="editor" class="screen" hidden>
  <header class="ed-header">
    <button class="icon-btn" id="btn-back" aria-label="一覧へ戻る">‹</button>
    <input type="text" id="note-title" class="title-input" placeholder="無題のメモ" aria-label="メモのタイトル">
    <span class="save-state" id="save-state">保存済み</span>
    <div class="spacer"></div>
    <button class="icon-btn" id="btn-undo" aria-label="元に戻す" title="元に戻す">↶</button>
    <button class="icon-btn" id="btn-redo" aria-label="やり直す" title="やり直す">↷</button>
    <button class="icon-btn" id="btn-more" aria-label="その他" title="その他">⋯</button>
  </header>

  <div class="ed-body">
    <div class="toolbar" id="toolbar" role="toolbar" aria-label="ペンツール">
      <button class="tool" data-tool="pen" title="ペン">🖊️</button>
      <button class="tool" data-tool="marker" title="マーカー">🖍️</button>
      <button class="tool" data-tool="eraser" title="消しゴム(なぞった線を消す)">🧽</button>
      <button class="tool" data-tool="lasso" title="なげなわ選択">🔗</button>
      <div class="tool-sep"></div>
      <div class="swatches" id="swatches" aria-label="色"></div>
      <div class="tool-sep"></div>
      <div class="widths" id="widths" aria-label="太さ"></div>
      <div class="tool-sep"></div>
      <button class="tool" id="btn-finger" title="指でも描く(オフ=指はスクロール専用)">👆</button>
      <button class="tool" id="btn-fit" title="幅に合わせる">⤢</button>
    </div>

    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div class="page-add" id="page-add">＋ ページを追加</div>
      <div class="zoom-badge" id="zoom-badge">100%</div>
      <div class="sel-actions" id="sel-actions" hidden>
        <button class="chip" id="sel-delete">🗑 削除</button>
        <button class="chip" id="sel-duplicate">⧉ 複製</button>
        <button class="chip" id="sel-cancel">✕ 解除</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 共通ダイアログ ============ -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="file-input" accept="application/json" hidden>

<script type="module" src="./js/main.js"></script>
</body>
</html>
