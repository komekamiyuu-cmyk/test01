# push されたら GitHub Pages に自動公開する
# (リポジトリの Settings → Pages → Source を「GitHub Actions」にしてください)
#
# 対象をデフォルトブランチだけに絞っている。
# github-pages 環境の保護ルールがデフォルトブランチ以外からのデプロイを拒否するため、
# 作業ブランチに対して走らせても必ず失敗し、PRに意味のない赤が付き続けてしまう。
# 作業ブランチからも公開したい場合は、
#   Settings → Environments → github-pages → Deployment branches and tags
# にそのブランチを追加したうえで、下の branches に足すか workflow_dispatch で手動実行する。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/windows-android-daw-g39n8d
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
