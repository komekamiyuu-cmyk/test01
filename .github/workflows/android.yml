# Android の APK をビルドして、成果物としてダウンロードできるようにする。
# GitHub のランナーには Android SDK が入っているので、手元に SDK が無くても APK が作れる。
name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'music-player/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Gradle のキャッシュ
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: APK をビルド
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: cassette-player-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
