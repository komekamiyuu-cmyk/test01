<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#E8E2D5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1A18" media="(prefers-color-scheme: dark)">
  <meta name="description" content="カセットプレーヤー - ローカルの音楽フォルダを再生するレトロなミュージックプレーヤー">
  <title>カセットプレーヤー</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📼</text></svg>">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">▶</span>
      <span class="brand-name">CASSETTE</span>
      <span class="brand-sub">AUDIO PLAYER / TYPE-Ⅰ</span>
    </div>
    <button id="openFolderBtn" class="btn primary">フォルダを開く</button>
    <input type="file" id="folderInput" webkitdirectory multiple hidden>
    <input type="file" id="filesInput" accept="audio/*,.mp3,.m4a,.aac,.ogg,.oga,.opus,.wav,.flac" multiple hidden>
  </header>

  <div class="stripe-band" aria-hidden="true">
    <i style="--c:#F5B415"></i><i style="--c:#F0930E"></i><i style="--c:#F07C10"></i>
    <i style="--c:#E2371F"></i><i style="--c:#B32036"></i><i style="--c:#7B1F42"></i>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="albums">アルバム</button>
    <button class="tab" data-tab="tracks">曲</button>
    <button class="tab" data-tab="favorites">お気に入り</button>
    <button class="tab" data-tab="playlists">プレイリスト</button>
    <button class="tab" data-tab="genres">ジャンル</button>
  </nav>

  <main id="content" class="content">
    <div class="empty-state" id="emptyState">
      <div class="empty-rule"></div>
      <p class="empty-kicker">NO TAPE LOADED</p>
      <h2 class="empty-title">音楽フォルダを<br>読み込んでください</h2>
      <div class="empty-actions">
        <button id="emptyOpenBtn" class="btn primary big">フォルダを選ぶ</button>
        <button id="emptyFilesBtn" class="btn big">曲ファイルを選ぶ(スマホ)</button>
      </div>
      <p class="empty-note">MP3 / M4A / AAC / OGG / WAV / FLAC &nbsp;·&nbsp; ファイルは端末内で処理されます</p>
      <p class="empty-note android-only">端末の音楽が表示されない場合は、設定 → アプリ → カセット → 権限 から
        「音楽とオーディオ」を許可してください</p>
    </div>
    <div id="viewRoot"></div>
  </main>

  <!-- ミニプレーヤー(画面下部) -->
  <div class="mini-player hidden" id="miniPlayer">
    <div class="mini-art" id="miniArt">♪</div>
    <div class="mini-info" id="miniInfo">
      <div class="mini-title" id="miniTitle">-</div>
      <div class="mini-artist" id="miniArtist">-</div>
    </div>
    <button id="miniPrevBtn" class="icon-btn" title="前の曲">◀◀</button>
    <button id="miniPlayBtn" class="icon-btn play" title="再生 / 一時停止">▶</button>
    <button id="miniNextBtn" class="icon-btn" title="次の曲">▶▶</button>
  </div>

  <!-- 再生中画面 -->
  <div class="now-playing hidden" id="nowPlaying">
    <div class="np-topbar">
      <button id="npCloseBtn" class="icon-btn" title="閉じる">▼</button>
      <span class="np-heading">NOW PLAYING</span>
      <button id="shotBtn" class="icon-btn" title="スクショをSNSにシェア">SHARE</button>
    </div>

    <div class="deck">
      <div class="deck-meters">
        <div class="vu"><span class="vu-label">L</span><div class="vu-bar" id="vuL"></div></div>
        <div class="vu"><span class="vu-label">R</span><div class="vu-bar" id="vuR"></div></div>
        <div class="counter-box">
          <span class="counter" id="tapeCounter">000</span>
          <span class="counter-label">COUNTER</span>
        </div>
      </div>

      <div class="cassette-wrap" id="cassette">
        <svg class="cassette-svg" viewBox="0 0 400 252" aria-hidden="true">
          <defs>
            <clipPath id="winClip"><rect x="44" y="84" width="156" height="88" rx="44"/></clipPath>
            <clipPath id="tagClip"><rect x="286" y="18" width="100" height="22"/></clipPath>
          </defs>

          <!-- シェル(メカ部) -->
          <rect x="0" y="0" width="400" height="252" rx="10" fill="#3A3936"/>
          <!-- リブ(成形の凹凸) -->
          <g stroke="#4A4844" stroke-width="2">
            <line x1="52" y1="20" x2="196" y2="20"/>
            <line x1="52" y1="28" x2="196" y2="28"/>
            <line x1="52" y1="226" x2="196" y2="226"/>
            <line x1="52" y1="234" x2="196" y2="234"/>
          </g>
          <!-- 縦組みテキスト -->
          <text x="30" y="212" fill="#6B6862" font-size="10" font-family="Oswald, sans-serif"
                letter-spacing="3" transform="rotate(-90 30 212)">COMPACT CASSETTE</text>

          <!-- テープ窓(淡いシアンの覗き窓) -->
          <rect x="44" y="84" width="156" height="88" rx="44" fill="#C8DDE0"/>
          <g clip-path="url(#winClip)">
            <!-- オレンジのブロック -->
            <rect x="52" y="84" width="19" height="88" fill="#EE3B12"/>
            <rect x="84" y="124" width="76" height="8" fill="#2B2A27"/>
            <circle id="spoolL" cx="84" cy="128" r="36" fill="#2B2A27"/>
            <circle id="spoolR" cx="160" cy="128" r="20" fill="#2B2A27"/>
          </g>
          <!-- ハブ(回転) -->
          <g id="hubL" class="hub-g">
            <circle cx="84" cy="128" r="13" fill="#98958E"/>
            <circle cx="84" cy="128" r="6" fill="#2B2A27"/>
            <g fill="#2B2A27">
              <rect x="82.6" y="115.5" width="2.8" height="5.5" transform="rotate(0 84 128)"/>
              <rect x="82.6" y="115.5" width="2.8" height="5.5" transform="rotate(60 84 128)"/>
              <rect x="82.6" y="115.5" width="2.8" height="5.5" transform="rotate(120 84 128)"/>
              <rect x="82.6" y="115.5" width="2.8" height="5.5" transform="rotate(180 84 128)"/>
              <rect x="82.6" y="115.5" width="2.8" height="5.5" transform="rotate(240 84 128)"/>
              <rect x="82.6" y="115.5" width="2.8" height="5.5" transform="rotate(300 84 128)"/>
            </g>
          </g>
          <g id="hubR" class="hub-g">
            <circle cx="160" cy="128" r="13" fill="#98958E"/>
            <circle cx="160" cy="128" r="6" fill="#2B2A27"/>
            <g fill="#2B2A27">
              <rect x="158.6" y="115.5" width="2.8" height="5.5" transform="rotate(0 160 128)"/>
              <rect x="158.6" y="115.5" width="2.8" height="5.5" transform="rotate(60 160 128)"/>
              <rect x="158.6" y="115.5" width="2.8" height="5.5" transform="rotate(120 160 128)"/>
              <rect x="158.6" y="115.5" width="2.8" height="5.5" transform="rotate(180 160 128)"/>
              <rect x="158.6" y="115.5" width="2.8" height="5.5" transform="rotate(240 160 128)"/>
              <rect x="158.6" y="115.5" width="2.8" height="5.5" transform="rotate(300 160 128)"/>
            </g>
          </g>

          <!-- ヘッド開口部 -->
          <path d="M62 252 L182 252 L170 206 L74 206 Z" fill="#2B2A27"/>
          <circle cx="96" cy="232" r="6" fill="#141413"/>
          <circle cx="148" cy="232" r="6" fill="#141413"/>
          <rect x="112" y="214" width="20" height="12" fill="#141413"/>

          <!-- 赤いネジ -->
          <g>
            <circle cx="20" cy="20" r="8" fill="#2B2A27"/><circle cx="20" cy="20" r="4.5" fill="#EE3B12"/>
            <circle cx="20" cy="232" r="8" fill="#2B2A27"/><circle cx="20" cy="232" r="4.5" fill="#EE3B12"/>
          </g>

          <!-- ラベル面(切り欠き付き) -->
          <path d="M214 0 L390 0 Q400 0 400 10 L400 242 Q400 252 390 252 L214 252 L214 146 Q204 138 214 128 Z" fill="#E8E2D5"/>

          <!-- タグ + ハッチング -->
          <rect x="228" y="18" width="34" height="22" fill="#EE3B12"/>
          <text x="245" y="34" text-anchor="middle" fill="#E8E2D5" font-size="13" font-weight="700" font-family="'Archivo Black', sans-serif">CP</text>
          <text x="228" y="13" fill="#5C5A54" font-size="6" letter-spacing="1.1" font-family="Oswald, sans-serif">PLAYER SYSTEM</text>
          <circle cx="272" cy="34" r="3.5" fill="#33322E"/>
          <g clip-path="url(#tagClip)">
            <g fill="#EE3B12">
              <rect x="286" y="10" width="13" height="38" transform="skewX(-20)"/>
              <rect x="308" y="10" width="13" height="38" transform="skewX(-20)"/>
              <rect x="330" y="10" width="13" height="38" transform="skewX(-20)"/>
              <rect x="352" y="10" width="13" height="38" transform="skewX(-20)"/>
            </g>
          </g>

          <!-- 罫線束 -->
          <g stroke="#5C5A54" stroke-width="1.6">
            <line x1="228" y1="150" x2="386" y2="150"/>
            <line x1="228" y1="156" x2="386" y2="156"/>
            <line x1="228" y1="162" x2="386" y2="162"/>
            <line x1="228" y1="168" x2="386" y2="168"/>
            <line x1="228" y1="174" x2="386" y2="174"/>
          </g>

          <!-- シリアル番号 -->
          <text x="228" y="192" fill="#EE3B12" font-size="8" font-weight="600" letter-spacing="1.3" font-family="Oswald, sans-serif">SERIAL NUMBER</text>
          <text id="cSerial" x="228" y="204" fill="#EE3B12" font-size="8.5" letter-spacing="1" font-family="Oswald, sans-serif">SBZR-0000-CA30</text>

          <!-- SIDE A + 巨大数字 -->
          <text x="386" y="242" text-anchor="end" fill="#33322E" opacity="0.22" font-size="52" font-family="'Archivo Black', sans-serif">A</text>
          <text x="228" y="240" fill="#33322E" font-size="11" font-weight="600" letter-spacing="2" font-family="Oswald, sans-serif">SIDE A</text>
          <path d="M300 228 L316 228 L308 240 Z" fill="#EE3B12"/>
        </svg>
        <div class="c-label-overlay">
          <div class="c-title" id="cTitle">-</div>
          <div class="c-artist" id="cArtist">-</div>
        </div>
      </div>

      <div class="deck-keys">
        <button class="key" id="npPrevBtn" title="前の曲">
          <span class="k-ico">◀◀</span><span class="k-label">REW</span>
        </button>
        <button class="key play" id="npPlayBtn" title="再生 / 一時停止">
          <span class="k-ico" id="npPlayIco">▶</span><span class="k-label" id="npPlayLabel">PLAY</span>
        </button>
        <button class="key" id="npNextBtn" title="次の曲">
          <span class="k-ico">▶▶</span><span class="k-label">FF</span>
        </button>
      </div>
    </div>

    <div class="np-progress">
      <span id="curTime" class="np-time">0:00</span>
      <input type="range" id="seekBar" min="0" max="1000" value="0">
      <span id="durTime" class="np-time">0:00</span>
    </div>

    <div class="np-controls">
      <button id="shuffleBtn" class="toggle" title="シャッフル再生">SHUFFLE</button>
      <button id="npFavBtn" class="toggle" title="お気に入り">♡ &nbsp;FAVORITE</button>
    </div>
  </div>

  <!-- プレイリスト追加ダイアログ -->
  <dialog id="plDialog" class="pl-dialog">
    <h3>プレイリストに追加</h3>
    <div id="plDialogList" class="pl-dialog-list"></div>
    <div class="pl-dialog-actions">
      <button id="plNewBtn" class="btn">新しいプレイリスト</button>
      <button id="plCancelBtn" class="btn">キャンセル</button>
    </div>
  </dialog>

  <!-- 生成したシェア画像のプレビュー -->
  <dialog id="shotDialog" class="shot-dialog">
    <h3>シェア画像</h3>
    <img id="shotImg" alt="再生中の曲のシェア画像">
    <p class="shot-hint">長押し(スマホ)/ 右クリック(PC)で画像を保存できます</p>
    <div class="pl-dialog-actions">
      <button id="shotSaveBtn" class="btn primary">保存</button>
      <button id="shotCloseBtn" class="btn">閉じる</button>
    </div>
  </dialog>

  <div id="toast" class="toast hidden"></div>

  <audio id="audio"></audio>
  <script type="module" src="js/main.js"></script>
  <script>
    // APK版は画面一式を同梱しているので Service Worker は登録しない
    if ('serviceWorker' in navigator && location.protocol !== 'file:' && !window.AndroidLibrary) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
